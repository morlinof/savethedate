<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilaria & Francesca · 3 Settembre 2027</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #F8F7F3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px 48px;
      font-family: 'DM Sans', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Immagine — rinomina il tuo file come "immagine.jpg" e mettilo nella stessa cartella */
    .img-box {
      width: 100%;
      border-radius: 3px;
      overflow: hidden;
      line-height: 0;
    }

    @media (max-width: 500px) {
      body {
        padding: 0 0 40px;
        justify-content: flex-start;
      }
      .card {
        max-width: 100%;
        gap: 20px;
      }
      .img-box {
        border-radius: 0;
      }
      .cal-btn {
        margin-top: 4px;
      }
    }

    .img-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Bottone calendario */
    .cal-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 15px 36px;
      background: #1B1917;
      color: #F8F7F3;
      text-decoration: none;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      transition: opacity 0.15s;
    }

    .cal-btn:hover { opacity: 0.78; }

    .cal-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- IMMAGINE: rinomina il file del grafico "immagine.jpg" e mettilo in questa cartella -->
    <div class="img-box">
      <img src="immagine.jpg" alt="Save the Date – Ilaria &amp; Francesca">
    </div>

    <!-- BOTTONE: cliccandolo su iPhone apre Apple Calendar, su Android apre Google Calendar -->
    <a class="cal-btn" href="matrimonio.ics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8"  y1="2" x2="8"  y2="6"/>
        <line x1="3"  y1="10" x2="21" y2="10"/>
      </svg>
      Save the Date
    </a>

  </div>

</body>
</html>
